<a href="../">Voltar ao site</a>

</div>
<aside class="roulette-promo-window" id="roulettePromo">
<div class="roulette-promo-handle" id="roulettePromoHandle">
<span>Arraste</span><button aria-label="Fechar" id="roulettePromoClose" type="button">×</button>
</div>
<strong>Tenha uma chance real comigo</strong>
</aside>
<a class="roulette-external-fallback" href="https://sharkbot.com.br/r/yasminsantos" rel="noopener" target="_blank">Abrir diretamente</a>
<script>
(() => {
  const windowElement = document.getElementById("roulettePromo");
  const handle = document.getElementById("roulettePromoHandle");
  const closeButton = document.getElementById("roulettePromoClose");
  if (!windowElement || !handle || !closeButton) return;
  let dragging = false, offsetX = 0, offsetY = 0;
  const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
  handle.addEventListener("pointerdown", (event) => {
    if (event.target === closeButton) return;
    dragging = true;
    const rect = windowElement.getBoundingClientRect();
    offsetX = event.clientX - rect.left;
    offsetY = event.clientY - rect.top;
    windowElement.style.left = rect.left + "px";
    windowElement.style.top = rect.top + "px";
    windowElement.style.right = "auto";
    windowElement.style.transform = "none";
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const maxX = window.innerWidth - windowElement.offsetWidth - 8;
    const maxY = window.innerHeight - windowElement.offsetHeight - 8;
    windowElement.style.left = clamp(event.clientX - offsetX, 8, maxX) + "px";
    windowElement.style.top = clamp(event.clientY - offsetY, 8, maxY) + "px";
  });
  const endDrag = (event) => {
    dragging = false;
    try { handle.releasePointerCapture(event.pointerId); } catch {}
  };
  handle.addEventListener("pointerup", endDrag);
  handle.addEventListener("pointercancel", endDrag);
  closeButton.addEventListener("click", () => windowElement.remove());
})();
</script>
